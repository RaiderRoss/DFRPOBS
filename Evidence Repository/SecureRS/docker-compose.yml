services:
  securs:
    build:
      context: .
      dockerfile: dockerfile
    image: secrs:1.0
    container_name: secrs
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8000}:8000"
    environment:
      - ENFORCE_SSL=${ENFORCE_SSL:-True}
      - ENFORCE_2FA=${ENFORCE_2FA:-True}
      - HTTP_PORT=8000
      - DB_PATH=/SecureRS/data/db.sqlite3
      - SITE_URL=${SITE_URL:-https://localhost:8443/}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - securs-data:/SecureRS/data
      - securs-media:/SecureRS/media
      - securs-certs:/SecureRS/certs
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import os, ssl, urllib.request
          ssl._create_default_https_context = ssl._create_unverified_context
          tls = os.environ.get("ENFORCE_SSL", "True").lower() not in ("0", "false", "no", "off")
          url = "https://localhost:443/" if tls else "http://localhost:8000/"
          urllib.request.urlopen(url, timeout=5)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  securs-data:
  securs-media:
  securs-certs:
