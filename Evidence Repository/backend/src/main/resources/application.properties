spring.application.name=dfraas-backend

# ---------------------------------------------------------------------------
# Datasource — matches the postgres service in the repo-root docker-compose.yml.
# Defaults are dev-only; override via environment variables (see .env.example).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:dfraas}
spring.datasource.username=${POSTGRES_USER:dfraas}
spring.datasource.password=${POSTGRES_PASSWORD:dfraas_dev_only}

# ---------------------------------------------------------------------------
# JPA — Liquibase owns the schema, Hibernate only validates against it.
# 'validate' is deliberate: an entity that drifts from a changeset fails startup
# rather than silently altering an audited table.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Liquibase — non-default location, so this path must be set explicitly.
# ---------------------------------------------------------------------------
spring.liquibase.change-log=classpath:liquibase/db.changelog-master.xml

# ---------------------------------------------------------------------------
# Kafka (Redpanda locally). The ingestion consumer is at-least-once, so it must
# dedupe on triggerEventId — see EvidenceEventConsumer.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:dfraas-ingestion}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Offsets are committed by the container only after the listener returns cleanly,
# so a crash mid-ingest redelivers rather than loses the trigger event.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# ---------------------------------------------------------------------------
# Actuator — health only until the security model is finalised.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# Dev-only credentials. Replace with an AppUser-backed UserDetailsService once
# that entity exists; until then this stops Boot generating a random password
# on every restart.
# ---------------------------------------------------------------------------
spring.security.user.name=${DEV_ADMIN_USER:admin}
spring.security.user.password=${DEV_ADMIN_PASSWORD:admin}
spring.security.user.roles=INVESTIGATOR

# ---------------------------------------------------------------------------
# CORS. The frontend is served from its own origin (the Vite dev server), and
# HTTP Basic's Authorization header is not CORS-safelisted, so every API call
# is preceded by a preflight OPTIONS. See config/SecurityConfiguration.
# Comma-separated allowlist — never a wildcard. Override per environment.
# ---------------------------------------------------------------------------
dfraas.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ---------------------------------------------------------------------------
# Application-specific properties (see config/StorageProperties, config/KafkaProperties)
# ---------------------------------------------------------------------------
dfraas.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
dfraas.storage.access-key=${MINIO_ACCESS_KEY:dfraas_admin}
dfraas.storage.secret-key=${MINIO_SECRET_KEY:dfraas_dev_only}
dfraas.storage.bucket=${MINIO_BUCKET:evidence-store}

dfraas.kafka.evidence-events-topic=${KAFKA_EVIDENCE_TOPIC:evidence-events}

# ---------------------------------------------------------------------------
# Multipart uploads, for POST /api/evidence-items. Boot's 1MB default rejects a log
# bundle of any realistic size, and does it as a container-level 413 that says
# nothing about evidence.
#
# The ceiling is a real constraint rather than a generous number: ingestion holds an
# artifact in memory to hash it, store it and read it back, so this is also the
# largest artifact that path can handle. Anything bigger — a disk image, a full
# memory capture — needs a streaming ingest, not a larger value here.
#
# The request limit sits above the file limit so the metadata part cannot push an
# otherwise legal artifact over the edge.
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=${MAX_ARTIFACT_SIZE:64MB}
spring.servlet.multipart.max-request-size=${MAX_ARTIFACT_REQUEST_SIZE:68MB}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI (springdoc). Both paths are permitAll in
# SecurityConfiguration, so set these to false before exposing this service
# beyond localhost — the spec enumerates every endpoint on the box.
# UI lands at http://localhost:8080/swagger-ui/index.html; /swagger-ui.html
# redirects there. Sign in with spring.security.user.* above.
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
# Groups operations by @Tag and sorts within them, so the page is stable between
# restarts rather than reordering with controller scan order.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# The generated "try it out" curl should show the server the browser is on.
springdoc.swagger-ui.display-request-duration=true
