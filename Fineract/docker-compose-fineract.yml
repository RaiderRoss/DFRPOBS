services:
  kafka:
    image: "apache/kafka:4.2.0-rc2"
    ports:
      - "9092:9092"
    env_file:
      - ./config/docker/env/kafka-server.env

  db:
    extends:
      file: ./config/docker/compose/postgresql.yml
      service: postgresql

  fineract-manager:
    image: apache/fineract:fd8fc8929
    ports:
      - "8443:8443"
    volumes:
      - fineract-plugins:/app/plugins
    healthcheck:
      # The Fineract image is Alpine/busybox based and ships no curl so we use busybox wget applet 
      test: ["CMD", "busybox", "wget", "--no-check-certificate", "-q", "-O", "-", "https://localhost:8443/fineract-provider/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - ./config/docker/env/fineract-manager.env
      - ./config/docker/env/fineract-common.env
      - ./config/docker/env/fineract-postgresql.env
      - ./config/docker/env/kafka-client.env

  fineract-worker:
    image: apache/fineract:fd8fc8929
    deploy:
      mode: replicated
      replicas: 1
    ports:
      - "8444-8445:8443"
    volumes:
      - fineract-plugins:/app/plugins
    depends_on:
      fineract-manager:
        condition: service_healthy
    env_file:
      - ./config/docker/env/fineract-worker.env
      - ./config/docker/env/fineract-common.env
      - ./config/docker/env/fineract-postgresql.env
      - ./config/docker/env/kafka-client.env

  listener:
    build:
      context: ./Kafka_Listener
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - AVRO_SCHEMA_DIR=/schemas
      - AVRO_TEMPLATE_DIR=/schemas/avro-templates
      - SECURERS_URL=${SECURERS_URL:-https://host.docker.internal:9443/pde/add/}
      - SECURERS_API_KEY=${SECURERS_API_KEY:?set SECURERS_API_KEY in Fineract/.env — see .env.example}
      - SECURERS_VERIFY_SSL=${SECURERS_VERIFY_SSL:-0}
      - FINERACT_HOST=fineract-manager
      - SECURERS_RANK=${SECURERS_RANK:-0.0}
      - DEAD_LETTER_PATH=/dead-letter/events.jsonl
      - LISTENER_VERBOSE=${LISTENER_VERBOSE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - listener-dead-letter:/dead-letter
    depends_on:
      - kafka
    restart: unless-stopped

volumes:
  fineract-plugins:
  listener-dead-letter: